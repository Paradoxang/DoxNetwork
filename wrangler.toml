# Cloudflare Workers con archivos estáticos.
#
# La tienda es estática: vite-react-ssg prerenderiza cada ruta a un .html y
# Cloudflare los sirve desde el borde. Desde el 29-sep-2026 hay además un
# script (`main`) con una sola ruta, /api/pedido, que crea en Shopify los
# pedidos del formulario contra entrega (worker/pedido.ts). `run_worker_first`
# limita el script a /api/*: el resto de peticiones siguen yendo directo a los
# archivos, que son gratis e ilimitados, y solo cuenta como invocación cada
# pedido enviado.
#
# Sin este archivo, `wrangler deploy` intenta adivinar el framework, detecta
# Vite y exige Vite 6+. Ese fue el error del primer intento.
#
# Las cabeceras de seguridad NO van aquí: viven en public/_headers, que Vite
# copia a dist/ en cada build.

name = "doxnetwork"
main = "worker/index.ts"
compatibility_date = "2026-09-18"

[assets]
directory = "./dist/"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# `/catalogo` sirve catalogo.html y `/catalogo/` redirige a `/catalogo`:
# una sola forma canónica de cada URL, igual que hacía cleanUrls en Vercel.
html_handling = "drop-trailing-slash"

# Cualquier ruta inexistente recibe dist/404.html, ya prerenderizada.
not_found_handling = "404-page"

# La tienda y el client ID de la app «Pedidos contra entrega» del Dev
# Dashboard de Shopify no son secretos. El secreto de esa app,
# SHOPIFY_CLIENT_SECRET, lo pone Santiago en Cloudflare (Workers → doxnetwork
# → Configuración → Variables y secretos) y nunca entra al repositorio.
[vars]
SHOPIFY_TIENDA = "yf61aj-nz.myshopify.com"
SHOPIFY_CLIENT_ID = "f844af4e4e9c3403b056798f0075ef7c"
